# Keys definition
keys:
  - &main 
  - &desktop 
  - &laptop 
  - &voron 

# Creation rules
creation_rules:
  # Common secrets for all hosts
  - path_regex: ^secrets/common\.yaml$
    key_groups:
      - age:
          - *main
          - *desktop
          - *laptop
          - *voron
  # Secrets for all personal hosts (desktop and laptop)
  - path_regex: ^secrets/personal\.yaml$
    key_groups:
      - age:
          - *main
          - *desktop
          - *laptop
  # Host specific secrets
  - path_regex: ^secrets/hosts/desktop\.yaml$
    key_groups:
      - age:
          - *main
          - *desktop
  - path_regex: ^secrets/hosts/laptop\.yaml$
    key_groups:
      - age:
          - *main
          - *laptop
  - path_regex: ^secrets/hosts/voron\.yaml$
    key_groups:
      - age:
          - *main
          - *voron
